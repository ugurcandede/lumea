name: Deploy Pages

on:
  push:
    branches: [master]
    paths:
      - 'docs/**'
      - 'assets/icon.png'
      - 'screenshots/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Images live once -- screenshots/ and assets/. Jekyll can't reach outside its source
      # directory, so they are copied in at build time.
      - name: Stage images
        run: |
          mkdir -p docs/assets/images
          cp screenshots/*.png docs/assets/images/
          cp assets/icon.png docs/assets/images/
          cp assets/icon.png docs/favicon.png

      - uses: actions/configure-pages@v5

      - uses: actions/jekyll-build-pages@v1
        with:
          source: ./docs
          destination: ./_site

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
