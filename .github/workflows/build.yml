name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'           # skip builds for docs-only pushes
      - 'plugins/**'      # plugins ship on their own (plugins/README.md), not as an app release
      - 'tools/**'
      - 'docs/**'         # the website deploys via pages.yml, not as an app release
      - 'screenshots/**'
      - '.github/workflows/pages.yml'
  workflow_dispatch:

permissions:
  contents: read

# One run at a time, end to end: a run that computes its version while another is
# still releasing would bump from the same tag and collide (v2.4.1 shipped after
# v2.5.0 that way). Queued runs wait; GitHub keeps only the newest pending one.
concurrency:
  group: release
  cancel-in-progress: false

defaults:
  run:
    shell: bash

jobs:
  version:
    name: Determine version
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.version.outputs.tag }}
      version: ${{ steps.version.outputs.version }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - id: version
        run: |
          # Bump the highest release tag by the last commit message:
          #   BREAKING:/bump: -> major, feat: -> minor, anything else -> patch.
          # Highest, not nearest (git describe): an out-of-order tag on HEAD's history
          # must not send the next version backwards into one that already exists.
          LATEST=$(git tag --list 'v[0-9]*' --sort=-v:refname | head -n 1)
          LATEST=${LATEST:-v0.0.0}
          MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3)
          MSG=$(git log -1 --pretty=%s)
          if echo "$MSG" | grep -qiE '^(BREAKING|bump):'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$MSG" | grep -qi '^feat:'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          echo "tag=v${MAJOR}.${MINOR}.${PATCH}"     >> "$GITHUB_OUTPUT"
          echo "version=${MAJOR}.${MINOR}.${PATCH}"  >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.artifact }}
    needs: version
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Lumea-windows
          - os: macos-14        # Apple Silicon (arm64)
            artifact: Lumea-macos-arm64

    env:
      # Where Nuitka keeps compiled C objects (MSVC's built-in cache on Windows,
      # ccache on macOS) and its downloads; the "Cache Nuitka" step carries it
      # between runs so a build only recompiles what changed.
      NUITKA_CACHE_DIR: ${{ github.workspace }}/.nuitka-cache

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # PySide6 wheels lag on the newest Python; pin a known-good one
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt nuitka ordered-set zstandard
          # Nuitka uses ccache on macOS only if it's installed.
          if [ "$RUNNER_OS" = "macOS" ]; then brew install ccache; fi

      - name: Cache Nuitka
        uses: actions/cache@v4
        with:
          path: ${{ env.NUITKA_CACHE_DIR }}
          # A new entry per run (caches are immutable), restored from the newest one
          # for this OS / Python / dependency set. Branch runs can't see master's
          # entries and vice versa, so the first build on each side starts cold.
          key: nuitka-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('requirements.txt') }}-${{ github.run_id }}
          restore-keys: |
            nuitka-${{ runner.os }}-${{ runner.arch }}-py3.12-${{ hashFiles('requirements.txt') }}-
            nuitka-${{ runner.os }}-${{ runner.arch }}-py3.12-

      - name: Write version.txt
        # Shown in Settings > About; source runs report dev.<sha> instead (see main.py).
        run: echo "${{ needs.version.outputs.version }}" > version.txt

      - name: Build Windows .exe
        if: runner.os == 'Windows'
        # Nuitka, not PyInstaller: one exe that unpacks once per version into a kept
        # folder, %LOCALAPPDATA%\ugurcandede\Lumea\<version> (the tempdir spec), instead
        # of into a new Temp\_MEI... folder on every launch. Faster starts, and an
        # update can't end up running from a folder its predecessor deletes.
        # updates.cleanup_old_unpacks() removes the previous versions' folders; it
        # relies on this {COMPANY}/{PRODUCT}/{VERSION} layout.
        # winrt imports foundation.collections at run time (reading an advert's
        # service UUIDs), out of Nuitka's sight; without it every scan comes back empty.
        run: |
          python -m nuitka main.py \
            --mode=onefile \
            --include-module=winrt.windows.foundation.collections \
            --msvc=latest \
            --assume-yes-for-downloads \
            --enable-plugins=pyside6 \
            --windows-console-mode=disable \
            --windows-icon-from-ico=assets/icon.ico \
            --include-data-files=assets/icon.png=assets/icon.png \
            --include-data-files=version.txt=version.txt \
            --company-name=ugurcandede \
            --product-name=Lumea \
            --file-version=${{ needs.version.outputs.version }} \
            --product-version=${{ needs.version.outputs.version }} \
            "--onefile-tempdir-spec={CACHE_DIR}/{COMPANY}/{PRODUCT}/{VERSION}" \
            --onefile-cache-mode=cached \
            --output-dir=dist \
            --output-filename=Lumea.exe

      - name: Build macOS .app
        if: runner.os == 'macOS'
        run: |
          # Nuitka wants an .icns icon on macOS; build one from assets/icon.png.
          mkdir -p icon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size"               assets/icon.png --out "icon.iconset/icon_${size}x${size}.png"
            sips -z "$((size*2))" "$((size*2))"   assets/icon.png --out "icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns icon.iconset -o assets/icon.icns

          # BLE app: macOS denies Bluetooth without a usage-description string in
          # Info.plist (--macos-app-protected-resource writes it).
          python -m nuitka main.py \
            --mode=app \
            --assume-yes-for-downloads \
            --enable-plugins=pyside6 \
            --macos-app-name=Lumea \
            --macos-signed-app-name=com.ugurcandede.lumea \
            --macos-app-icon=assets/icon.icns \
            --macos-app-version=${{ needs.version.outputs.version }} \
            "--macos-app-protected-resource=NSBluetoothAlwaysUsageDescription:Lumea uses Bluetooth to control your LED strips." \
            --include-data-files=assets/icon.png=assets/icon.png \
            --include-data-files=version.txt=version.txt \
            --output-dir=dist \
            --output-filename=Lumea
          APP=$(ls -d dist/*.app)
          [ "$APP" = dist/Lumea.app ] || mv "$APP" dist/Lumea.app

          # Data files out of Contents/MacOS into Contents/Resources (updates.bundled
          # finds them there): codesign seals non-code files in MacOS through xattrs,
          # which unzip and the cask's `xattr -cr` strip, breaking the seal.
          mv dist/Lumea.app/Contents/MacOS/version.txt dist/Lumea.app/Contents/MacOS/assets dist/Lumea.app/Contents/Resources/

          # Fail here, not on users' Macs, if the bundle isn't laid out as the app expects:
          # the Bluetooth string (or macOS kills it on scan), and the data files.
          plutil -p dist/Lumea.app/Contents/Info.plist | grep -q NSBluetoothAlwaysUsageDescription
          test -f dist/Lumea.app/Contents/Resources/version.txt
          test -f dist/Lumea.app/Contents/Resources/assets/icon.png

          # Ad-hoc sign so the bundle isn't flagged as "damaged" (still NOT notarized), and
          # check the seal survives what users and the cask do to it (xattr -cr).
          codesign --force --deep --sign - dist/Lumea.app
          cp -R dist/Lumea.app "$RUNNER_TEMP/seal-check.app" && xattr -cr "$RUNNER_TEMP/seal-check.app"
          codesign --verify --deep --strict "$RUNNER_TEMP/seal-check.app"

          # Zip the .app -- ditto preserves the bundle structure and symlinks.
          ditto -c -k --keepParent dist/Lumea.app "dist/${{ matrix.artifact }}.zip"

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/Lumea.exe
          if-no-files-found: error

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Release + Homebrew cask
    needs: [version, build]
    # Publish only from master. A manual run on another branch (Actions > Build >
    # Run workflow) stops at the build artifacts, so a build can be tried first.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          cp artifacts/Lumea-windows/Lumea.exe                  release/Lumea-windows.exe
          cp artifacts/Lumea-macos-arm64/Lumea-macos-arm64.zip  release/Lumea-macos-arm64.zip

      - name: SHA256 of the macOS zip
        id: sha
        run: echo "sha256=$(shasum -a 256 release/Lumea-macos-arm64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ needs.version.outputs.tag }}" -m "Release ${{ needs.version.outputs.tag }}"
          git push origin "${{ needs.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.version.outputs.tag }}
          name: Lumea ${{ needs.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release/Lumea-windows.exe
            release/Lumea-macos-arm64.zip
          body: |
            Unsigned build.
            - **macOS:** `brew install --cask ugurcandede/tap/lumea` (the cask clears Gatekeeper for you), or download the zip and run `xattr -cr Lumea.app` once.
            - **Windows:** SmartScreen → More info → Run anyway.

            macOS arm64 zip SHA256: `${{ steps.sha.outputs.sha256 }}`

      - name: Update Homebrew cask
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/ugurcandede/homebrew-tap.git" /tmp/tap
          cd /tmp/tap
          sed -i "s|version \".*\"|version \"${{ needs.version.outputs.version }}\"|" Casks/lumea.rb
          sed -i "s|sha256 \".*\"|sha256 \"${{ steps.sha.outputs.sha256 }}\"|" Casks/lumea.rb
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/lumea.rb
          git commit -m "Update lumea cask to v${{ needs.version.outputs.version }}" || exit 0
          git push
