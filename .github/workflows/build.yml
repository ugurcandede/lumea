name: Build

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'           # skip builds for docs-only pushes
  workflow_dispatch:

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  build:
    name: ${{ matrix.artifact }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            artifact: Lumea-windows
          - os: macos-14        # Apple Silicon (arm64)
            artifact: Lumea-macos-arm64

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'  # PySide6/Pillow wheels lag on the newest Python; pin a known-good one
          cache: pip

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller

      - name: Build Windows .exe
        if: runner.os == 'Windows'
        run: |
          pyinstaller --noconfirm --clean --windowed --onefile \
            --name Lumea \
            --icon assets/icon.ico \
            --add-data "assets/icon.png;assets" \
            main.py

      - name: Build macOS .app
        if: runner.os == 'macOS'
        run: |
          # PyInstaller wants an .icns icon on macOS; build one from assets/icon.png.
          mkdir -p icon.iconset
          for size in 16 32 128 256 512; do
            sips -z "$size" "$size"               assets/icon.png --out "icon.iconset/icon_${size}x${size}.png"
            sips -z "$((size*2))" "$((size*2))"   assets/icon.png --out "icon.iconset/icon_${size}x${size}@2x.png"
          done
          iconutil -c icns icon.iconset -o assets/icon.icns

          pyinstaller --noconfirm --clean --windowed \
            --name Lumea \
            --icon assets/icon.icns \
            --osx-bundle-identifier com.ugurcandede.lumea \
            --add-data "assets/icon.png:assets" \
            main.py

          # BLE app: macOS denies Bluetooth without a usage-description string in Info.plist.
          plutil -insert NSBluetoothAlwaysUsageDescription \
            -string "Lumea uses Bluetooth to control your LED strips." \
            dist/Lumea.app/Contents/Info.plist

          # Ad-hoc sign so the bundle isn't flagged as "damaged" (still NOT notarized).
          codesign --force --deep --sign - dist/Lumea.app

          # Zip the .app -- ditto preserves the bundle structure and symlinks.
          ditto -c -k --keepParent dist/Lumea.app "dist/${{ matrix.artifact }}.zip"

      - name: Upload Windows artifact
        if: runner.os == 'Windows'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/Lumea.exe
          if-no-files-found: error

      - name: Upload macOS artifact
        if: runner.os == 'macOS'
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: dist/${{ matrix.artifact }}.zip
          if-no-files-found: error

  release:
    name: Release + Homebrew cask
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    concurrency:
      group: release
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Collect release assets
        run: |
          mkdir -p release
          cp artifacts/Lumea-windows/Lumea.exe                  release/Lumea-windows.exe
          cp artifacts/Lumea-macos-arm64/Lumea-macos-arm64.zip  release/Lumea-macos-arm64.zip

      - name: Determine version
        id: version
        run: |
          # Bump the latest tag by the last commit message:
          #   BREAKING:/bump: -> major, feat: -> minor, anything else -> patch.
          LATEST=$(git describe --tags --abbrev=0 2>/dev/null || echo "v0.0.0")
          MAJOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f1)
          MINOR=$(echo "$LATEST" | sed 's/v//' | cut -d. -f2)
          PATCH=$(echo "$LATEST" | sed 's/v//' | cut -d. -f3)
          MSG=$(git log -1 --pretty=%s)
          if echo "$MSG" | grep -qiE '^(BREAKING|bump):'; then
            MAJOR=$((MAJOR + 1)); MINOR=0; PATCH=0
          elif echo "$MSG" | grep -qi '^feat:'; then
            MINOR=$((MINOR + 1)); PATCH=0
          else
            PATCH=$((PATCH + 1))
          fi
          echo "tag=v${MAJOR}.${MINOR}.${PATCH}"     >> "$GITHUB_OUTPUT"
          echo "version=${MAJOR}.${MINOR}.${PATCH}"  >> "$GITHUB_OUTPUT"

      - name: SHA256 of the macOS zip
        id: sha
        run: echo "sha256=$(shasum -a 256 release/Lumea-macos-arm64.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

      - name: Create tag
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "${{ steps.version.outputs.tag }}" -m "Release ${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: Lumea ${{ steps.version.outputs.tag }}
          generate_release_notes: true
          files: |
            release/Lumea-windows.exe
            release/Lumea-macos-arm64.zip
          body: |
            Unsigned build.
            - **macOS:** `brew install --cask ugurcandede/lumea/lumea` (the cask clears Gatekeeper for you), or download the zip and run `xattr -cr Lumea.app` once.
            - **Windows:** SmartScreen → More info → Run anyway.

            macOS arm64 zip SHA256: `${{ steps.sha.outputs.sha256 }}`

      - name: Update Homebrew cask
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          git clone "https://x-access-token:${GH_TOKEN}@github.com/ugurcandede/homebrew-lumea.git" /tmp/tap
          cd /tmp/tap
          sed -i "s|version \".*\"|version \"${{ steps.version.outputs.version }}\"|" Casks/lumea.rb
          sed -i "s|sha256 \".*\"|sha256 \"${{ steps.sha.outputs.sha256 }}\"|" Casks/lumea.rb
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add Casks/lumea.rb
          git commit -m "Update lumea cask to v${{ steps.version.outputs.version }}" || exit 0
          git push
